# Sampling is a configured policy here, not a given. Software observability
# tooling samples because it can afford to, so ordinary traffic falls through
# to a 10% probabilistic policy. Traces that touch governed data do not: the
# two keep-policies below run first and retain them in full, so sampling
# is never the reason a trace reference on a lineage event fails to resolve. Delete them and this is plain
# ~10% sampling again (the rate is a parameter, not a property), against Marquez, which receives every OpenLineage event
# with no equivalent knob. The contrast is a choice of policy, not of tracing.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  tail_sampling:
    decision_wait: 5s
    policies:
      # RAID R09, and the reason this policy is first: sampling is what makes a
      # trace reference dangle. A trace that recorded *lineage being lost* is
      # the one an operator will come looking for, so it must never be the nine
      # in ten that were thrown away. Keep those unconditionally; sample the
      # rest. Losing the record of a loss is the failure mode twice over.
      - name: always-keep-lineage-loss
        type: string_attribute
        string_attribute:
          key: lineage.dropped
          values: ["true"]
      # The broader form of the same idea, and a candidate position for the RFC:
      # any span that produced an OpenLineage event carries `lineage.run_id`, so
      # this keeps every trace in which an agent touched governed data, at any
      # sampling rate. The consequence is the one that matters: sampling can
      # no longer be the reason a trace reference on a lineage event fails to
      # resolve, which answers R09 leg (b) for sampling. The client injecting
      # `traceparent` and the backend still holding the trace remain assumptions. Sampling remains an economic decision
      # for ordinary traffic; a governed data interaction is not ordinary
      # traffic and is not subject to it.
      - name: always-keep-data-access
        type: ottl_condition
        ottl_condition:
          span:
            - 'attributes["lineage.run_id"] != nil'
      - name: ten-percent-sample
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Metrics have no backend in this demo. RAID D12 says lineage *absence* must
  # surface on the telemetry plane, so the counters have to go somewhere an
  # operator can read — here, the collector's own log
  # (`docker compose logs otel-collector`). A real deployment routes these to
  # Prometheus or equivalent; the demo only has to prove the signal exists.
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlp/jaeger]
    # Without this pipeline the `mcp_lineage.events.dropped` counter is emitted
    # by the server and discarded by the collector — the loss signal itself
    # lost, silently. Found while implementing RAID I29.
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
