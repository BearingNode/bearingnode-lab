[project]
name = "mcp-server-ol"
version = "0.1.0"
description = "OpenLineage instrumentation for a real Postgres MCP server (RAID D03)"
requires-python = ">=3.12"

dependencies = [
    # The real, unmodified upstream server we instrument — RAID D03.
    # Pinned: upstream is dormant since 2026-01-22 (RAID I13).
    "postgres-mcp==0.3.0",
    # OpenLineage client — never hand-roll event JSON, per this lab's own OpenLineage standard.
    "openlineage-python==1.53.0",
    # SQL parser. Rust extension; manylinux_2_28 cp310-abi3 wheels exist for
    # x86_64 and aarch64, so no source build on our targets.
    "openlineage-sql==1.53.0",
    # Software-observability plane. RAID D12: a lineage store cannot report on
    # events it never received, so lineage *absence* has to surface here — the
    # instrumented server had no OTel at all until RAID I29, which is why the
    # loss paths had nowhere to go.
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff==0.14.13",
    "mypy>=1.14",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_ol"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Unit-only by default; integration needs the compose stack and is opt-in,
# per this lab's own testing standard: "A suite that cannot run without
# `docker compose up` will stop being run."
addopts = "-m 'not integration'"
markers = [
    "integration: requires the docker compose stack (deselected by default)",
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
lint.select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# Without these two, `mypy src` and the editable install's sys.path entry for
# `src` (added by `uv sync --editable`) give the same file two different
# module names ("telemetry" vs "mcp_server_ol.telemetry") and mypy refuses to
# proceed. `mcp_server_ol/` has no `__init__.py` (py.typed marks it typed
# instead), so mypy can't infer the package root on its own — tell it.
mypy_path = "src"
explicit_package_bases = true

# Upstream ships no `py.typed`, so its symbols are `Any` and strict mode objects
# to subclassing them (RAID D03 — the whole integration is a subclass). Scoped
# to the specific third-party modules rather than blanket-disabled, so our own
# code stays strictly checked.
[[tool.mypy.overrides]]
module = ["postgres_mcp.*", "openlineage_sql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp_server_ol.driver"
disallow_subclassing_any = false
